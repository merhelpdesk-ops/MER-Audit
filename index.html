<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER Audit Reports - Maintain Transparency</title>
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Primary Meta Tags -->
    <meta name="title" content="MER Audit Reports - Maintain Transparency">
    <meta name="description" content="Official smart contract and system security audit reports for MER. Transparency and security first.">

    <!-- Open Graph / Facebook / Telegram -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MER Audit Reports - Maintain Transparency">
    <meta property="og:description" content="Explore and verify all official smart contract audit reports.">
    <meta property="og:image" content="merdex-social-card.png">

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="MER Audit Reports - Maintain Transparency">
    <meta property="twitter:description" content="Explore and verify all official smart contract audit reports.">
    <meta property="twitter:image" content="merdex-social-card.png">

    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0e1424;
            --border-color: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-cyan: #00d2ff;
            --accent-blue: #0072ff;
            --hover-bg: #182238;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, #0d1d3a 0%, #070a12 70%);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .social-banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.1);
        }

        .social-banner img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d2ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-box {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            color: #ffffff;
            border-color: transparent;
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .report-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .report-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .auditor-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(0, 210, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .report-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .report-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 0.65rem;
            background-color: var(--hover-bg);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="social-banner">
        <img src="merdex-social-card.png" alt="MER Audit Report Banner" onerror="this.style.display='none'">
    </div>

    <header>
        <div class="brand">
            <img src="logo.webp" alt="Logo" onerror="this.style.display='none'">
            <h1>MER Audit Reports</h1>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Search audit reports by name, auditor, or tag...">
        <div class="filter-tags" id="filterTags">
            <button class="tag-btn active" data-filter="all">All</button>
            <button class="tag-btn" data-filter="Solana">Solana</button>
            <button class="tag-btn" data-filter="Vault">Vault</button>
            <button class="tag-btn" data-filter="Staking">Staking</button>
            <button class="tag-btn" data-filter="Guardian">Guardian</button>
            <button class="tag-btn" data-filter="Zenith">Zenith</button>
            <button class="tag-btn" data-filter="Zellic">Zellic</button>
        </div>
    </div>

    <div class="report-grid" id="reportGrid"></div>
</div>

<script>
    const reports = [
        { name: "CertiK Audit (09/2022)", file: "CertiK_09_2022.pdf", auditor: "CertiK", date: "2022-09", tags: ["General"] },
        { name: "Guardian Audit (07/2024)", file: "Guardian_07_2024.pdf", auditor: "Guardian", date: "2024-07", tags: ["General"] },
        { name: "Guardian Audit (10/2023)", file: "Guardian_10_2023.pdf", auditor: "Guardian", date: "2023-10", tags: ["General"] },
        { name: "Guardian OFT Audit", file: "Guardian_OFT_07_2024.pdf", auditor: "Guardian", date: "2024-07", tags: ["OFT"] },
        { name: "Guardian Solana Staking", file: "Guardian_Solana_Staking_01_2024.pdf", auditor: "Guardian", date: "2024-01", tags: ["Solana", "Staking"] },
        { name: "Guardian Solana Vault", file: "Guardian_Solana_Vault_11_2023.pdf", auditor: "Guardian", date: "2023-11", tags: ["Solana", "Vault"] },
        { name: "Guardian Strategy Vault", file: "Guardian_Strategy_Vault_02_2024.pdf", auditor: "Guardian", date: "2024-02", tags: ["Vault", "Strategy"] },
        { name: "Halborn Audit (07/2022)", file: "Halborn_07_2022.pdf", auditor: "Halborn", date: "2022-07", tags: ["General"] },
        { name: "Independent Researcher Review", file: "Independent Researcher_09_2023.pdf", auditor: "Independent", date: "2023-09", tags: ["Research"] },
        { name: "OtterSec Solana Vault", file: "OtterSec_Solana_Vault_11_2023.pdf", auditor: "OtterSec", date: "2023-11", tags: ["Solana", "Vault"] },
        { name: "Sherlock Audit (08/2024)", file: "Sherlock_08_2024.pdf", auditor: "Sherlock", date: "2024-08", tags: ["General"] },
        { name: "Sherlock Solana Vault", file: "Sherlock_Solana_Vault_10_2023.pdf", auditor: "Sherlock", date: "2023-10", tags: ["Solana", "Vault"] },
        { name: "Zellic Audit (11/2023)", file: "Zellic_11_2023.pdf", auditor: "Zellic", date: "2023-11", tags: ["General"] },
        { name: "Zellic Strategy Vault", file: "Zellic_Strategy_Vault_03_2024.pdf", auditor: "Zellic", date: "2024-03", tags: ["Vault", "Strategy"] },
        { name: "Zenith LayerZeroV2", file: "Zenith_LayerZeroV2_04_2024.pdf", auditor: "Zenith", date: "2024-04", tags: ["LayerZero"] },
        { name: "Zenith Solana Staking", file: "Zenith_Solana_Staking_03_2024.pdf", auditor: "Zenith", date: "2024-03", tags: ["Solana", "Staking"] },
        { name: "Zenith Strategy Vault", file: "Zenith_Strategy_Vault_06_2024.pdf", auditor: "Zenith", date: "2024-06", tags: ["Vault", "Strategy"] },
        { name: "Swap Specification & Audit", file: "swap.pdf", auditor: "Internal", date: "2023-01", tags: ["Swap"] }
    ];

    const grid = document.getElementById('reportGrid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.tag-btn');
    let currentFilter = 'all';

    function renderReports() {
        const query = searchInput.value.toLowerCase();
        grid.innerHTML = '';

        const filtered = reports.filter(r => {
            const matchesSearch = r.name.toLowerCase().includes(query) || 
                                  r.auditor.toLowerCase().includes(query) ||
                                  r.file.toLowerCase().includes(query);
            
            const matchesFilter = currentFilter === 'all' || 
                                  r.tags.includes(currentFilter) || 
                                  r.auditor === currentFilter ||
                                  r.file.includes(currentFilter);

            return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="no-results">No matching audit reports found</div>';
            return;
        }

        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'report-card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="auditor-badge">${r.auditor}</span>
                        <span class="report-date">${r.date}</span>
                    </div>
                    <div class="report-title">${r.name}</div>
                </div>
                <a href="${r.file}" class="download-btn" target="_blank">
                    View Report (PDF)
                </a>
            `;
            grid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', renderReports);

    filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            filterButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.getAttribute('data-filter');
            renderReports();
        });
    });

    renderReports();
</script>

</body>
</html>
