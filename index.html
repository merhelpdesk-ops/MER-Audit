<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MER Audit Report</title>
  
  <link rel="canonical" href="https://audits.mer.finance/" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

  <!-- Schema.org for Google -->
  <meta itemprop="name" content="MER Audit Report">
  <meta itemprop="description" content="Official smart contract audit reports and security verification files for MER Protocol.">
  <meta itemprop="image" content="https://audits.mer.finance/merposter.png">

  <!-- Open Graph / Facebook / Telegram -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MER Audit Report">
  <meta property="og:url" content="https://audits.mer.finance/">
  <meta property="og:title" content="MER Audit Report">
  <meta property="og:description" content="Official smart contract audit reports and security verification files for MER Protocol.">
  <meta property="og:image" content="https://audits.mer.finance/merposter.png">
  <meta property="og:image:secure_url" content="https://audits.mer.finance/merposter.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:domain" content="audits.mer.finance">
  <meta name="twitter:url" content="https://audits.mer.finance/">
  <meta name="twitter:title" content="MER Audit Report">
  <meta name="twitter:description" content="Official smart contract audit reports and security verification files for MER Protocol.">
  <meta name="twitter:image" content="https://audits.mer.finance/merposter.png">
  <meta name="twitter:image:src" content="https://audits.mer.finance/merposter.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            },
            dark: {
              bg: '#0b0f17',
              card: '#111827',
              border: '#1f2937',
              hover: '#1f2937'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">

  <header class="border-b border-dark-border bg-dark-card/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="logo.webp" alt="MER Audit Report" class="h-10 md:h-12 w-auto object-contain">
        <div class="border-l border-dark-border pl-4 hidden sm:block">
          <p class="text-xs text-gray-400">MER supports any institution to conduct audits.</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-brand-500/10 text-brand-500 border border-brand-500/20">
          <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
          18 Verified Files
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by firm, module, or filename..." 
          class="w-full pl-10 pr-4 py-2.5 bg-dark-card border border-dark-border rounded-xl text-sm focus:outline-none focus:border-brand-500 text-gray-200 placeholder-gray-500 transition-colors"
        >
      </div>

      <div class="flex flex-wrap gap-2 w-full md:w-auto" id="filterTabs">
        <button data-category="all" class="filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-brand-500 text-gray-950 shadow-sm transition-all">All</button>
        <button data-category="Core Protocol" class="filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-dark-card text-gray-400 hover:text-white border border-dark-border transition-all">Core Protocol</button>
        <button data-category="Solana" class="filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-dark-card text-gray-400 hover:text-white border border-dark-border transition-all">Solana</button>
        <button data-category="Strategy Vault" class="filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-dark-card text-gray-400 hover:text-white border border-dark-border transition-all">Strategy Vault</button>
        <button data-category="Cross-Chain" class="filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-dark-card text-gray-400 hover:text-white border border-dark-border transition-all">Cross-Chain</button>
      </div>
    </div>

    <div class="bg-dark-card border border-dark-border rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-dark-bg/60 border-b border-dark-border text-xs uppercase text-gray-400 font-semibold tracking-wider">
            <tr>
              <th scope="col" class="py-4 px-6">Audit Firm / Scope</th>
              <th scope="col" class="py-4 px-6">Target / Module</th>
              <th scope="col" class="py-4 px-6">Date</th>
              <th scope="col" class="py-4 px-6">File Name</th>
              <th scope="col" class="py-4 px-6 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="reportsTable" class="divide-y divide-dark-border">
          </tbody>
        </table>
      </div>
      
      <div id="noResults" class="hidden py-12 text-center text-gray-500">
        <i class="fa-regular fa-folder-open text-4xl mb-3 block opacity-50"></i>
        No matching audit reports found.
      </div>
    </div>
  </main>

  <script>
    const reports = [
      { firm: "CertiK", scope: "Core Protocol", category: "Core Protocol", date: "09/2022", file: "CertiK_09_2022.pdf" },
      { firm: "Guardian", scope: "Core Protocol", category: "Core Protocol", date: "07/2024", file: "Guardian_07_2024.pdf" },
      { firm: "Guardian", scope: "Core Protocol", category: "Core Protocol", date: "10/2023", file: "Guardian_10_2023.pdf" },
      { firm: "Guardian", scope: "OFT (Omnichain)", category: "Cross-Chain", date: "07/2024", file: "Guardian_OFT_07_2024.pdf" },
      { firm: "Guardian", scope: "Solana Staking", category: "Solana", date: "03/2025", file: "Guardian_Solana_Staking_03_2025.pdf" },
      { firm: "Guardian", scope: "Solana Vault", category: "Solana", date: "11/2025", file: "Guardian_Solana_Vault_11_2025.pdf" },
      { firm: "Guardian", scope: "Strategy Vault", category: "Strategy Vault", date: "02/2025", file: "Guardian_Strategy_Vault_02_2025.pdf" },
      { firm: "Halborn", scope: "Core Protocol", category: "Core Protocol", date: "07/2022", file: "Halborn_07_2022.pdf" },
      { firm: "Independent Researcher", scope: "Protocol Review", category: "Core Protocol", date: "09/2023", file: "Independent Researcher_09_2023.pdf" },
      { firm: "OtterSec", scope: "Solana Vault", category: "Solana", date: "11/2024", file: "OtterSec_Solana_Vault_11_2024.pdf" },
      { firm: "Sherlock", scope: "Core Protocol", category: "Core Protocol", date: "08/2024", file: "Sherlock_08_2024.pdf" },
      { firm: "Sherlock", scope: "Solana Vault", category: "Solana", date: "10/2024", file: "Sherlock_Solana_Vault_10_2024.pdf" },
      { firm: "CertiK", scope: "Swap", category: "Cross-Chain", date: "10/2021", file: "swap.pdf" },
      { firm: "Zellic", scope: "Core Protocol", category: "Core Protocol", date: "11/2023", file: "Zellic_11_2023.pdf" },
      { firm: "Zellic", scope: "Strategy Vault", category: "Strategy Vault", date: "03/2025", file: "Zellic_Strategy_Vault_03_2025.pdf" },
      { firm: "Zenith", scope: "LayerZero V2", category: "Cross-Chain", date: "04/2025", file: "Zenith_LayerZeroV2_04_2025.pdf" },
      { firm: "Zenith", scope: "Solana Staking", category: "Solana", date: "03/2025", file: "Zenith_Solana_Staking_03_2025.pdf" },
      { firm: "Zenith", scope: "Strategy Vault", category: "Strategy Vault", date: "06/2025", file: "Zenith_Strategy_Vault_06_2025.pdf" }
    ];

    let currentCategory = 'all';
    let searchQuery = '';

    function renderTable() {
      const tbody = document.getElementById('reportsTable');
      const noResults = document.getElementById('noResults');
      
      const filtered = reports.filter(r => {
        const matchesCategory = currentCategory === 'all' || r.category === currentCategory;
        const matchesSearch = r.firm.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              r.scope.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              r.file.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      tbody.innerHTML = filtered.map(r => {
        const isImage = r.file.endsWith('.png') || r.file.endsWith('.jpg');
        const iconClass = isImage ? 'fa-image text-amber-400' : 'fa-file-pdf text-brand-500';
        const buttonText = isImage ? 'View Image' : 'View PDF';
        const dotBg = isImage ? 'bg-amber-400/60' : 'bg-brand-500/60';
        const btnStyle = isImage ? 'bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-gray-950 border-amber-500/20' : 'bg-brand-500/10 text-brand-500 hover:bg-brand-500 hover:text-gray-950 border-brand-500/20';

        return '<tr class="hover:bg-dark-hover/50 transition-colors group">' +
          '<td class="py-4 px-6 font-semibold text-white flex items-center gap-2">' +
            '<span class="w-2 h-2 rounded-full ' + dotBg + '"></span>' +
            r.firm +
          '</td>' +
          '<td class="py-4 px-6">' +
            '<span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-gray-800 text-gray-300 border border-gray-700">' +
              r.scope +
            '</span>' +
          '</td>' +
          '<td class="py-4 px-6 text-gray-400 font-mono text-xs">' + r.date + '</td>' +
          '<td class="py-4 px-6 font-mono text-xs text-gray-400 group-hover:text-gray-200 transition-colors">' +
            r.file +
          '</td>' +
          '<td class="py-4 px-6 text-right">' +
            '<a href="./' + encodeURIComponent(r.file) + '" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium ' + btnStyle + ' transition-all border">' +
              '<i class="fa-solid ' + iconClass + '"></i>' +
              buttonText +
            '</a>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('filterTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-dark-card text-gray-400 hover:text-white border border-dark-border transition-all';
      });
      btn.className = 'filter-btn px-4 py-2 text-xs font-medium rounded-lg bg-brand-500 text-gray-950 shadow-sm transition-all';
      
      currentCategory = btn.dataset.category;
      renderTable();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
    });

    renderTable();
  </script>
</body>
</html>
